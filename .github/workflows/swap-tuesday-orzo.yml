name: Freigegebenen Rezepttausch manuell ausfuehren

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: einkaufsliste-live-aenderung
  cancel-in-progress: false

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "firebase-admin>=6.5,<8"
      - name: Dienstag Rezept sicher austauschen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/swap_tuesday_orzo.py
